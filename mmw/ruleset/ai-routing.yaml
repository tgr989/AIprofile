# 2026-11-22 对照 jinxinkai/clash-ai-rules、妙妙屋现有规则提供方及厂商文档整理。
# 将本文件的 rule-providers 和 rules 分别合入 Mihomo 订阅的同名配置段。
rules:
  # 拒绝目标属于 category-ai-!cn 的 UDP 443。
  - 'AND,((NETWORK,UDP),(DST-PORT,443),(GEOSITE,category-ai-!cn)),REJECT'
  # 将 claude.yaml 的 UDP 443 拦截规则插在此处。

  # 拒绝发往 ChatGPT Voice 官方目标 CIDR 的 UDP 3478 和 TCP 443。
  - 'AND,((NETWORK,UDP),(DST-PORT,3478),(RULE-SET,chatgpt-voice,no-resolve)),REJECT'
  - 'AND,((NETWORK,TCP),(DST-PORT,443),(RULE-SET,chatgpt-voice,no-resolve)),REJECT'

rule-providers:
  chatgpt-voice:
    type: http
    behavior: ipcidr
    format: mrs
    url: https://raw.githubusercontent.com/tgr989/AIprofile/refs/heads/main/mmw/ruleset/openai/ipcidr-openai-chatgpt-voice.mrs
    path: ./ruleset/ipcidr-openai-chatgpt-voice.mrs
    interval: 86400
  ai-routing:
    type: inline
    behavior: classical
    payload:
      # Gemini CLI 站点与 Gemini Docs MCP。
      # https://geminicli.com/docs/get-started/installation/
      # https://aistudio.google.com/docs/coding-agents
      - 'DOMAIN,gemini-api-docs-mcp.dev'
      - 'DOMAIN-SUFFIX,geminicli.com'

      # Meta / Muse 域名与关键词
      - 'DOMAIN-SUFFIX,facebookquotes4u.com'
      - 'DOMAIN-SUFFIX,fbaddins.com'
      - 'DOMAIN-SUFFIX,fbcdn-a.akamaihd.net'
      - 'DOMAIN-SUFFIX,instagr.am'
      - 'DOMAIN-SUFFIX,ip6.static.sl-reverse.com'
      - 'DOMAIN-SUFFIX,whatsapp.biz'
      - 'DOMAIN-SUFFIX,llamameta.net'

      # 不严格的风控, 可按需开启
      # - 'DOMAIN-KEYWORD,facebook'
      # - 'DOMAIN-KEYWORD,fbcdn'

      # Muse Code SDK 文档。
      # https://dev.meta.ai/docs/muse-code
      - 'DOMAIN,meta-models.github.io'

      # Meta 目标网段与主网 ASN
      # - 'IP-ASN,32934'

      # OpenAI 域名与关键词
      - 'DOMAIN-SUFFIX,ai.com'
      - 'DOMAIN,chatgpt-async-webps-prod-eastus-4.webpubsub.azure.com'
      - 'DOMAIN,openai-api.arkoselabs.com'
      - 'DOMAIN-SUFFIX,client-api.arkoselabs.com'
      # 以下注释掉的共用域名通过订阅中的 RULE-SET,claude 匹配。
      # claude.yaml 的 statsig.com 和 statsigapi.net 后缀分别覆盖下面两个子域。
      # - 'DOMAIN-SUFFIX,api.statsig.com'
      # - 'DOMAIN-SUFFIX,events.statsigapi.net'
      - 'DOMAIN-SUFFIX,featuregates.org'
      # claude.yaml 已包含相同的 Intercom 域名后缀。
      # - 'DOMAIN-SUFFIX,intercom.io'
      # - 'DOMAIN-SUFFIX,intercomcdn.com'

      # 不严格的风控, 可按需开启
      # - 'DOMAIN-KEYWORD,openai'
      # - 'DOMAIN-KEYWORD,chatgpt'
      # - 'DOMAIN-KEYWORD,codex'

      # ChatGPT 与 Codex 客户端使用的第三方主机。
      # https://help.openai.com/en/articles/9247338-network-recommendations-for-chatgpt-errors-on-web-and-apps
      - 'DOMAIN-WILDCARD,*.ct.sendgrid.net'
      - 'DOMAIN,cdn.workos.com'
      - 'DOMAIN,challenges.cloudflare.com'
      - 'DOMAIN,forwarder.workos.com'
      - 'DOMAIN,frontend-apps-multi-region.workos.com'
      - 'DOMAIN,humb.apple.com'
      - 'DOMAIN,images.workoscdn.com'
      - 'DOMAIN,js.stripe.com'
      # claude.yaml 的 sentry.io 后缀覆盖以下主机。
      # - 'DOMAIN,o207216.ingest.sentry.io'
      # claude.yaml 通过 datadog 关键词覆盖这个端点，此处启用精确域名规则。
      - 'DOMAIN,rum.browser-intake-datadoghq.com'
      - 'DOMAIN,setup.workos.com'
      - 'DOMAIN,workos.imgix.net'

      # OpenAI 目标网段与 ASN
      # 如需匹配 ChatGPT Connectors 网段（含 199.47.142.0/23），请在 rule-providers 中引用
      # mmw/ruleset/openai/ipcidr-openai-chatgpt-connectors.mrs，behavior 为 ipcidr，format 为 mrs。
      # - 'IP-CIDR6,2604:f20::/32,no-resolve'
      # - 'IP-ASN,401518,no-resolve'
